[package]
name = "memory_core"
version = "1.3.1"
edition = "2021"
description = "Brepsi Brain backend: storage, search and MCP server (port of the Python memory_base)"
license = "Apache-2.0"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
regex = "1"
serde_json = "1"
sha1_smol = "1"
native-tls = "0.2"
fancy-regex = "0.14"
md5 = "0.7"
sha2 = "0.10"
toml = { version = "0.8", default-features = false, features = ["parse"] }
toml_edit = { version = "0.22", default-features = false, features = ["parse", "display"] }
ureq = { version = "3.5", default-features = false, features = ["native-tls-no-default"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
zstd = "0.14"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_SystemInformation",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
