[package]
name = "brepsi_brain"
version = "1.3.1"
description = "Brepsi Brain desktop shell (Tauri 2) for the memory-base dashboard"
edition = "2021"

[[bin]]
name = "BrepsiBrain"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde_json = "1"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
sys-locale = "0.3"
rfd = "0.15"
memory_core = { path = "../../core" }
tauri-selfupdate = { git = "https://github.com/AndreyVerse/tauri-selfupdate.git", branch = "main" }

# Версия совпадает с memory_core: крейт один, добавляется только фича реестра.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_System_Registry", "Win32_Foundation"] }

# Портативный exe: вес и старт важнее времени сборки. panic=abort безопасен —
# паники не ловятся catch_unwind ни здесь, ни в memory_core, а MCP-процесс короткоживущий.
[profile.release]
lto = true
opt-level = "s"
strip = true
codegen-units = 1
panic = "abort"

# Kaspersky ложно детектит build-script-build.exe (cookie 0.18.2) как
# HEUR:Trojan.Win64.Convagent.gen и удаляет его до запуска. Свой opt-level у
# скриптов сборки даёт другие байты — эвристика перестаёт совпадать; логика
# скриптов от этого не меняется. Правильное лечение — исключение в антивирусе,
# но исключение на файл не покрывает пересобранный скрипт.
[profile.release.build-override]
opt-level = 1
