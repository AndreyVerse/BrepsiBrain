<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Brepsi Brain</title>
  <style>
    /* Startup screen, bundled into the app: it shows while the local server
       comes up, so the window never loads a page that is not there yet. The
       shell (src-tauri/src/main.rs) replaces it with the dashboard. */
    @font-face { font-family: "Manrope"; font-weight: 500; src: url("fonts/manrope-cyrillic-500-normal.woff2") format("woff2"); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
    @font-face { font-family: "Manrope"; font-weight: 700; src: url("fonts/manrope-cyrillic-700-normal.woff2") format("woff2"); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
    @font-face { font-family: "Manrope"; font-weight: 500; src: url("fonts/manrope-latin-500-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
    @font-face { font-family: "Manrope"; font-weight: 700; src: url("fonts/manrope-latin-700-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
    :root {
      --bg: #101117; --text: #edeef5; --text-2: #b9bace; --text-3: #9092a8;
      --accent: #b5a1fa; --mint: #87d8c3; --err: #f08484; --line: #2b2c3c;
      --grad: linear-gradient(90deg, #b5a1fa, #87d8c3);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center; overflow: hidden; cursor: default; user-select: none;
      background: radial-gradient(ellipse 720px 460px at 50% 42%, #251e3540, transparent 75%), var(--bg);
      color: var(--text); font: 500 14px/1.55 "Manrope", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased; transition: opacity .18s ease;
    }
    body.leaving { opacity: 0; }
    .splash { display: flex; flex-direction: column; align-items: center; text-align: center; width: min(420px, 86vw); animation: rise .5s cubic-bezier(.2, .7, .2, 1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } }

    /* Rings and dots of the memory map around the mark. */
    .orbits { position: relative; width: 208px; height: 208px; display: grid; place-items: center; margin-bottom: 22px; }
    .ring { position: absolute; inset: 0; border: 1px solid #b5a1fa26; border-radius: 50%; animation: turn 14s linear infinite; }
    .ring.mid { inset: 26px; border-color: #87d8c32e; animation-duration: 9s; animation-direction: reverse; }
    .ring.near { inset: 50px; border-color: #b5a1fa3d; animation-duration: 6s; }
    .ring i { position: absolute; top: -3.5px; left: calc(50% - 3.5px); width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px #b5a1fa90; }
    .ring.mid i { background: var(--mint); box-shadow: 0 0 10px #87d8c390; }
    .ring i + i { top: auto; bottom: -3px; left: 22%; width: 5px; height: 5px; opacity: .7; }
    @keyframes turn { to { transform: rotate(360deg); } }
    .mark { position: relative; width: 84px; height: 84px; filter: drop-shadow(0 8px 26px #b5a1fa38); animation: breathe 2.6s ease-in-out infinite; }
    @keyframes breathe { 50% { transform: scale(1.045); filter: drop-shadow(0 8px 34px #b5a1fa60); } }

    h1 { margin: 0; font-size: 30px; line-height: 1.15; font-weight: 700; letter-spacing: -.03em; }
    h1 span { color: var(--accent); }
    .sub { margin: 6px 0 26px; color: var(--text-2); font-size: 13.5px; }
    .track { position: relative; width: 220px; height: 3px; border-radius: 3px; background: var(--line); overflow: hidden; }
    .track i { position: absolute; top: 0; bottom: 0; width: 40%; border-radius: 3px; background: var(--grad); animation: slide 1.5s cubic-bezier(.45, .05, .55, .95) infinite; }
    @keyframes slide { from { left: -40%; } to { left: 100%; } }
    .status { min-height: 21px; margin-top: 14px; color: var(--text-3); font-size: 12.5px; transition: color .2s ease; }

    .failed .track i { width: 100%; left: 0; background: var(--err); opacity: .55; animation: none; }
    .failed .status { color: var(--err); }
    .detail { margin-top: 4px; color: var(--text-3); font-size: 12px; overflow-wrap: anywhere; }
    .detail:empty { display: none; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body data-tauri-drag-region="deep">
  <main id="splash" class="splash" role="status" aria-live="polite">
    <div class="orbits" aria-hidden="true">
      <span class="ring"><i></i><i></i></span>
      <span class="ring mid"><i></i><i></i></span>
      <span class="ring near"><i></i></span>
      <svg class="mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <linearGradient id="tile" x1="48" y1="6" x2="208" y2="250" gradientUnits="userSpaceOnUse"><stop stop-color="#2c3340"/><stop offset=".5" stop-color="#1a1e27"/><stop offset="1" stop-color="#0f1117"/></linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(128 126) rotate(90) scale(122)" gradientUnits="userSpaceOnUse"><stop stop-color="#4f86ff" stop-opacity=".32"/><stop offset="1" stop-color="#4f86ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="rim" x1="60" y1="6" x2="196" y2="250" gradientUnits="userSpaceOnUse"><stop stop-color="#fff" stop-opacity=".32"/><stop offset=".45" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity=".1"/></linearGradient>
    <linearGradient id="lobe" x1="40" y1="30" x2="216" y2="226" gradientUnits="userSpaceOnUse"><stop stop-color="#a9c2ff"/><stop offset=".5" stop-color="#5f93ff"/><stop offset="1" stop-color="#3a7bf0"/></linearGradient>
  </defs>
  <rect x="8" y="13" width="240" height="240" rx="60" fill="#05060a"/>
  <rect x="8" y="6" width="240" height="240" rx="60" fill="url(#tile)"/>
  <rect x="8" y="6" width="240" height="240" rx="60" fill="url(#glow)" stroke="url(#rim)" stroke-width="2.5"/>
  <g transform="translate(128 126) scale(.82) translate(-128 -128)">
    <path d="M120 34c-22-5-47 3-56 22-26 3-43 26-38 51-18 16-20 44-3 61-3 26 17 47 42 47 12 13 34 16 55 7Z" fill="url(#lobe)"/>
    <path d="M120 34c-22-5-47 3-56 22-26 3-43 26-38 51-18 16-20 44-3 61-3 26 17 47 42 47 12 13 34 16 55 7Z" fill="url(#lobe)" transform="translate(256 0) scale(-1 1)"/>
    <path d="M128 34v188" stroke="#1a1e27" stroke-width="8"/>
    <path d="M74 84 128 128 182 84M128 128 74 172M128 128l54 44M128 128V60M128 128v68" stroke="#1a1e27" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="74" cy="84" r="14" fill="#1a1e27"/><circle cx="182" cy="84" r="14" fill="#1a1e27"/><circle cx="74" cy="172" r="14" fill="#1a1e27"/><circle cx="182" cy="172" r="14" fill="#1a1e27"/>
    <circle cx="128" cy="128" r="27" fill="#1a1e27"/><circle cx="128" cy="128" r="17" fill="#f4f8ff"/>
  </g>
</svg>
    </div>
    <h1>Brepsi Brain<span>.</span></h1>
    <p id="sub" class="sub">Личное пространство памяти</p>
    <div class="track"><i></i></div>
    <div id="status" class="status">Открываем вашу память…</div>
    <div id="detail" class="detail"></div>
  </main>
  <script>
    "use strict";
    // Runs on the page's event loop. The shell calls these through eval; until it
    // does, the wording only changes with time, so a slow start does not look stuck.
    (function () {
      const splash = document.getElementById("splash");
      const status = document.getElementById("status");
      const detail = document.getElementById("detail");
      // Язык выбирает оболочка (трей или локаль Windows) до загрузки страницы.
      const en = window.__SB_LANG === "en";
      const L = en
        ? { sub: "Your personal memory space", opening: "Opening your memory…", starting: "Starting the local database…",
            almost: "Almost there, preparing records and cards…", failed: "The server did not start, trying again…" }
        : { sub: "Личное пространство памяти", opening: "Открываем вашу память…", starting: "Запускаем локальную базу…",
            almost: "Ещё немного, готовим записи и карточки…", failed: "Сервер не запустился, пробуем ещё раз…" };
      document.documentElement.lang = en ? "en" : "ru";
      document.getElementById("sub").textContent = L.sub;
      status.textContent = L.opening;
      const stages = [[3000, L.starting], [9000, L.almost]];
      const timers = stages.map(([ms, text]) => setTimeout(() => { status.textContent = text; }, ms));

      window.splashFailed = function (message) {
        timers.forEach(clearTimeout);
        splash.classList.add("failed");
        status.textContent = L.failed;
        detail.textContent = message;
      };
      window.splashRetrying = function () {
        splash.classList.remove("failed");
        status.textContent = L.starting;
        detail.textContent = "";
      };
      window.splashLeaving = function () {
        document.body.classList.add("leaving");
      };
    })();
  </script>
</body>
</html>
